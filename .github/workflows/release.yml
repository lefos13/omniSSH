name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"


# Cancel superseded release runs for the same tag/ref to prevent duplicate workflows and wasted runner minutes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  # Create the draft release ONCE so the parallel build matrix all upload to
  # the same release. GitHub does not de-duplicate *draft* releases by tag, so
  # previously each matrix job raced to create its own draft → multiple v*
  # drafts with split assets. Reuse an existing draft if present (e.g. on a
  # workflow re-run) to stay idempotent.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create or reuse the draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ inputs.tag }}" || process.env.GITHUB_REF_NAME;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag && r.draft);
            if (existing) {
              core.info(`Reusing existing draft release ${existing.id} for ${tag}`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `OmniSSH ${tag}`,
              body: "",
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-14
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
            label: Linux
          - platform: windows-latest
            args: ""
            rust_target: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          # Update package.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          # Update tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # Update Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the single release created up front (no per-job drafts).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonKeepUniversal: true

  update-release-notes:
    needs: build
    runs-on: ubuntu-latest
    name: Generate release notes

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            let commits = "";
            try {
              const prevTag = execSync("git tag --sort=-version:refname | head -2 | tail -1", { encoding: "utf8" }).trim();
              const tag = "${{ inputs.tag }}" || process.env.GITHUB_REF_NAME || "v1.0.0";
              if (prevTag && prevTag !== tag) {
                commits = execSync(`git log --pretty=format:"- %s" "${prevTag}..HEAD"`, { encoding: "utf8" }).trim();
              } else {
                commits = execSync("git log -n 25 --pretty=format:\"- %s\" HEAD", { encoding: "utf8" }).trim();
              }
            } catch (e) {
              commits = "- Initial release of OmniSSH";
            }
            const body = [
              "## What\x27s New",
              "",
              commits,
              "",
              "## Downloads",
              "",
              "| Platform | File |",
              "|----------|------|",
              "| macOS (Apple Silicon) | `.dmg` (aarch64) |",
              "| macOS (Intel) | `.dmg` (x64) |",
              "| Windows | `.msi` / `.exe` |",
              "| Linux | `.deb` / `.rpm` / `.AppImage` |",
              "",
              "## Installation",
              "",
              "Download the appropriate installer for your operating system from the assets below.",
              "",
              "macOS users: If you see \"app is damaged\" or Gatekeeper prompt, run:",
              "```bash",
              "xattr -cr /Applications/OmniSSH.app",
              "```",
              "",
              "## Auto-Updates",
              "",
              "Already have OmniSSH installed? Navigate to **Settings > Updates** and click **Check for updates** to update seamlessly in-app.",
            ].join("\n");
            fs.writeFileSync("release_notes.md", body, "utf8");
          '
      - name: Update release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          RELEASE_TAG="${TAG:-$GITHUB_REF_NAME}"
          gh release edit "$RELEASE_TAG" \
            --notes-file release_notes.md
